services:
  - type: web
    name: wexa-cognodb-api
    runtime: docker
    dockerfilePath: ./backend/WexaGraph.Api/Dockerfile
    dockerContext: ./backend/WexaGraph.Api
    plan: free
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USERNAME
        sync: false
      - key: COGNODB_PASSWORD
        sync: false

  - type: web
    name: wexa-cognodb-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/wexa/browser
